name: Publish Windows update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-windows-update
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Publish rolling update
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force latest $env:GITHUB_SHA
          git push --force origin refs/tags/latest

          gh release view latest *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            $existingAssets = @(gh release view latest --json assets --jq '.assets[].name')
            foreach ($asset in $existingAssets) {
              if ($asset -ne 'AudioForge.exe') {
                gh release delete-asset latest $asset --yes
                if ($LASTEXITCODE -ne 0) { throw "Could not remove old release asset $asset" }
              }
            }
            gh release upload latest build\Release\AudioForge.exe --clobber
          } else {
            gh release create latest build\Release\AudioForge.exe `
              --title "AudioForge latest" `
              --notes "Automatically built from the latest main branch source."
          }
