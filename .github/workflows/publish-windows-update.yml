name: Publish Windows update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-windows-update
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure
        run: cmake -S . -B build -A x64 -DAUDIOFORGE_COMMIT=${{ github.sha }}

      - name: Build
        run: cmake --build build --config Release

      - name: Create update manifest
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'build\Release\AudioForge.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = @(
            "commit=$env:GITHUB_SHA"
            "sha256=$hash"
          )
          Get-ChildItem 'build\Release\assets' -File | Sort-Object Name | ForEach-Object {
            $assetHash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $manifest += "asset=$($_.Name),$assetHash"
          }
          $manifest | Set-Content -Path AudioForge-update.txt -Encoding ascii

      - name: Publish rolling update
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force latest $env:GITHUB_SHA
          git push --force origin refs/tags/latest

          gh release view latest *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $assets = @(Get-ChildItem 'build\Release\assets' -File | ForEach-Object { $_.FullName })
          $releaseFiles = @('build\Release\AudioForge.exe', 'AudioForge-update.txt') + $assets
          if ($releaseExists) {
            gh release upload latest $releaseFiles --clobber
          } else {
            gh release create latest $releaseFiles `
              --title "AudioForge latest" `
              --notes "Automatically built from the latest main branch source."
          }
